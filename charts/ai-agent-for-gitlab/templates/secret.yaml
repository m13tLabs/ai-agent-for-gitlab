{{- if not .Values.secrets.existingSecret }}
{{- $fullname := include "ai-agent.fullname" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $fullname }}
{{- $adminToken := .Values.secrets.adminToken }}
{{- if and (not $adminToken) $existing }}
{{- $adminToken = index $existing.data "ADMIN_TOKEN" | b64dec }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "ai-agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  GITLAB_TOKEN: {{ required "secrets.gitlabToken is required (or set secrets.existingSecret)" .Values.secrets.gitlabToken | quote }}
  WEBHOOK_SECRET: {{ required "secrets.webhookSecret is required (or set secrets.existingSecret)" .Values.secrets.webhookSecret | quote }}
  ADMIN_TOKEN: {{ default (randAlphaNum 32) $adminToken | quote }}
{{- end }}
