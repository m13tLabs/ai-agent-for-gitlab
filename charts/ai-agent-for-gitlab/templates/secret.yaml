{{- if not .Values.secrets.existingSecret }}
{{- $s := .Values.secrets }}
{{- $refs := $s.secretKeyRefs | default dict }}
{{- $fullname := include "ai-agent.fullname" . }}
{{- $data := dict }}
{{- /* Tokens with a secrets.secretKeyRefs.<token>.name come from that Secret instead. */}}
{{- if .Values.gitlabSetup.enabled }}
{{- if not (dig "gitlabAdminToken" "name" "" $refs) }}
{{- $_ := set $data $s.keys.gitlabAdminToken (required "secrets.gitlabAdminToken is required when gitlabSetup.enabled (or set secrets.existingSecret or secrets.secretKeyRefs.gitlabAdminToken)" $s.gitlabAdminToken) }}
{{- end }}
{{- else if not (dig "gitlabToken" "name" "" $refs) }}
{{- $_ := set $data $s.keys.gitlabToken (required "secrets.gitlabToken is required (or set secrets.existingSecret or secrets.secretKeyRefs.gitlabToken)" $s.gitlabToken) }}
{{- end }}
{{- /* Generated when empty and kept across upgrades (lookup needs a live cluster). */}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $fullname }}
{{- range $token := list "webhookSecret" "adminToken" }}
{{- if not (dig $token "name" "" $refs) }}
{{- $key := index $s.keys $token }}
{{- $value := index $s $token | default (dig "data" $key "" $existing | b64dec) | default (randAlphaNum 32) }}
{{- $_ := set $data $key $value }}
{{- end }}
{{- end }}
{{- if $data }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "ai-agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := $data }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
{{- end }}
