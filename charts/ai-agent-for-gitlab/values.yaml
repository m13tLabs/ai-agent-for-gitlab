# -- Number of webhook middleware replicas.
# Note: /admin/disable and /admin/enable only affect the pod that serves the request,
# so keep this at 1 if you rely on the admin endpoints.
replicaCount: 1

image:
  repository: m13t/ai-agent-for-gitlab-app
  # -- Set to the release version by each release (scripts/pin-release-version.sh).
  # "" falls back to .Chart.AppVersion.
  tag: "0.7.2"
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# -- Image the CI job uses to run the agent, forwarded to pipelines as
# AI_AGENT_IMAGE=<repository>:<tag>. Pipeline variables override the default in
# .gitlab-ci.yml, so every project uses this image.
# Set repository to "" to keep each project's own AI_AGENT_IMAGE.
agentImage:
  repository: m13t/ai-agent-for-gitlab-agent
  # -- Set to the release version by each release (scripts/pin-release-version.sh).
  # "" falls back to .Chart.AppVersion.
  tag: "0.7.2"

gitlab:
  # -- GitLab instance URL
  url: https://gitlab.com
  # -- Username of the AI service account the token belongs to (e.g. review-agent).
  # GitLab reserves usernames starting with ai-, ai_, duo- and duo_.
  aiUsername: ""
  # -- Email of the AI service account (used for commits)
  aiEmail: ""

# Secrets. Either set the values here or reference an existing Secret.
secrets:
  # -- Name of an existing Secret; if set, no Secret is created by the chart
  existingSecret: ""
  # -- Keys inside the existing Secret
  keys:
    gitlabToken: GITLAB_TOKEN
    webhookSecret: WEBHOOK_SECRET
    adminToken: ADMIN_TOKEN
    gitlabAdminToken: GITLAB_ADMIN_TOKEN
  # -- Per-token references to other existing Secrets, e.g.
  # `gitlabToken: {name: gitlab-token, key: token}`. A set `name` overrides
  # existingSecret and the inline value for that token only; an empty `key`
  # falls back to secrets.keys.<token>. The chart Secret still holds the rest.
  secretKeyRefs:
    gitlabToken: {name: "", key: ""}
    webhookSecret: {name: "", key: ""}
    adminToken: {name: "", key: ""}
    gitlabAdminToken: {name: "", key: ""}
  # -- Token of the AI service account (scopes: api, read_repository, write_repository).
  # Not used when gitlabSetup.enabled: the setup job creates and rotates the bot token.
  gitlabToken: ""
  # -- GitLab administrator token (scopes: api, admin_mode) for gitlabSetup. Only
  # mounted into the setup Job/CronJob, never into the webhook pods.
  gitlabAdminToken: ""
  # -- Secret token configured on the GitLab webhook. Generated (and kept across
  # upgrades) when empty; read it from the Secret shown in the install notes.
  # Set it explicitly with `helm template`/GitOps tools, where `lookup` can't
  # see the cluster and a generated value would change on every render.
  webhookSecret: ""
  # -- Bearer token for /admin endpoints. Generated (and kept across upgrades) when empty.
  adminToken: ""

# Automated GitLab setup. When enabled, a Job (on every install/upgrade) and a
# CronJob, both using secrets.gitlabAdminToken:
#   - create the bot (gitlab.aiUsername) as a service account and set its avatar
#   - add it with accessLevel to the groups matching `groups`
#   - register a system hook sending merge request events to this release's
#     Service, so reviewer/assignee requests work on every project
#   - for each project matching `projects`: add the bot as member and create a
#     project webhook with comment events, so @mentions work (system hooks
#     can't send comment events)
#   - create the bot's access token and store it in the Secret
#     <fullname>-bot-token, which the webhook pods read as GITLAB_TOKEN
#     (secrets.gitlabToken is ignored); rotated before expiry
# The CronJob picks up groups and projects created later. `helm uninstall`
# leaves the bot, its memberships, the hooks and the bot-token Secret in place.
gitlabSetup:
  # -- Enable the automated GitLab setup (requires secrets.gitlabAdminToken)
  enabled: false
  # -- "service_account" (instance service account) or "user" (regular user, for
  # GitLab versions without the service account API)
  accountType: service_account
  # -- Display name of the bot account
  botName: AI Agent
  # -- Upload the bundled bot avatar (files/bot-avatar.png) as the bot's avatar
  avatar: true
  # -- Default bot role in each group/project: 30 = Developer, 40 = Maintainer.
  # Roles are only raised, never lowered.
  accessLevel: 30
  # -- Groups to add the bot to. Each entry is a full path or glob pattern
  # (`*` and `?`, case-insensitive; `*` also matches `/`), or an object
  # `{path: <pattern>, accessLevel: <role>}`; the first matching entry wins.
  # A group is skipped when a selected ancestor already grants at least the
  # same role, so `["*"]` = every group, but only top-level groups get a
  # membership. `[]` = no groups. Groups marked for deletion are skipped.
  groups: ["*"]
  # -- Projects to add the bot to and give a project webhook (comment events,
  # needed for @mentions). Same pattern rules as `groups`, matched against the
  # project's full path; objects also take `mergeRequestsEvents` (default: true
  # only when systemHook.enabled is false, since both hooks would trigger every
  # review twice). `["*"]` = every project, `[]` = none. The bot membership is
  # skipped when an inherited role is already high enough; archived projects
  # and projects marked for deletion are skipped. Each CronJob run makes about
  # three API calls per project, so narrow this on large instances, e.g.
  # `["my-group/*", {path: "other/app", accessLevel: 40}]`.
  projects: ["*"]
  systemHook:
    # -- Register the merge request system hook
    enabled: true
    # -- URL GitLab posts to, for the system hook and the project webhooks;
    # empty = this release's in-cluster Service
    # (http://<fullname>.<namespace>.svc.cluster.local:<service.port>/webhook).
    # Use the ingress URL when GitLab runs outside the cluster.
    url: ""
    # -- Verify TLS when GitLab calls the hook URL (system hook and project webhooks)
    sslVerification: true
  token:
    # -- Lifetime of the bot token in days
    expiryDays: 90
    # -- Rotate the bot token this many days before it expires
    renewBeforeDays: 14
  # Runner mode, set up in GitLab: the component project (synced from
  # `component.cloneUrl`, made a CI/CD Catalog resource) and the runner
  # project whose .gitlab-ci.yml includes its agent-runner component. The bot
  # becomes Owner of both. `runner.project` is used as agent.runnerProject
  # unless that is set.
  centralPipeline:
    # -- Create and maintain the component and runner projects
    enabled: false
    # -- Visibility of both projects (private, internal or public)
    visibility: private
    component:
      # -- Full path of the component project; its group must exist
      project: ai/ai-agent-for-gitlab
      # -- Git URL the component project is synced from. The setup Job clones
      # it on every run and pushes its branches and tags into the component
      # project (fast-forward only), so the Job needs access to it (a proxy
      # goes into `additionalEnvs`), GitLab doesn't. A private source needs
      # credentials in the URL; they're left out of descriptions and logs.
      cloneUrl: https://github.com/m13tLabs/ai-agent-for-gitlab.git
      # -- Additionally let GitLab pull-mirror `cloneUrl` between setup runs,
      # where the edition supports it (detected from edition and license:
      # Premium or Ultimate). Needs GitLab itself to reach `cloneUrl`; if it
      # can't, the setup Job logs a warning and its own sync carries on.
      mirror: true
      # -- Ref of the component the runner project includes (branch, tag or
      # SHA); empty = this chart's release tag, `v<appVersion>` (e.g. v0.7.1),
      # which the component's `version` input also defaults to
      ref: ""
    runner:
      # -- Full path of the runner project; its group must exist
      project: ai/agent-runner
      # -- Inputs for the agent-runner component, e.g. `{tags: [ai-agent]}`
      inputs: {}
      # -- Only create the runner project's .gitlab-ci.yml when it's missing
      # and never update it afterwards, e.g. to maintain it by hand after the
      # first setup. The bot's Owner membership is still ensured.
      initialSetupOnly: false
      # -- Further `include:` entries after the component, e.g.
      # `[{project: infra/helpers, ref: v1.0.0, file: .gitlab-ci/include.yml}]`
      extraIncludes: []
      # -- Further top-level configuration for the runner project's
      # .gitlab-ci.yml: a YAML string (kept as is) or a map. A job named like
      # the component's `job-name` input is merged with the agent job, e.g.
      # `{ai-review: {extends: [.proxy_setup]}}`.
      extraConfig: ""
  # -- CronJob schedule for re-syncing (new groups/projects, token rotation)
  schedule: "17 * * * *"
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 256Mi

agent:
  # -- Mention that triggers the agent in comments. Empty = `@<gitlab.aiUsername>`
  # when gitlabSetup.enabled (the account it creates), else `@ai`.
  triggerPhrase: ""
  # -- opencode model in provider/model form
  model: azure/gpt-4.1
  # -- Base prompt for the agent (OPENCODE_AGENT_PROMPT)
  prompt: ""
  # -- Prefix for branches created for issues
  branchPrefix: ai
  # -- Central project (full path or id) that runs every agent pipeline, so
  # the other projects need no .gitlab-ci.yml changes; see
  # the agent-runner CI/CD component in templates/. Empty = run in each
  # project's own pipeline.
  runnerProject: ""
  # -- Branch of the runner project to run the pipelines on; empty = its default branch
  runnerRef: ""
  # -- Check `model` against the agent image's model catalog in an init
  # container of the webhook pods; an unknown model fails the rollout. Needs
  # `agentImage.repository`. Turn off for models newer than the agent image, or
  # custom opencode providers.
  validateModel: true
  # -- Stop opencode in the agent jobs from fetching its model catalog
  # (OPENCODE_DISABLE_MODELS_FETCH); it then uses the catalog baked into the
  # agent image at build time. For air-gapped runners.
  disableModelsFetch: false
  # -- Cancel older pending pipelines on the same ref
  cancelOldPipelines: true
  # -- Emoji awarded when a run starts
  startReactionEmoji: robot

review:
  # -- Start a review when the AI user is added as reviewer on a merge request
  #    (requires the "Merge request events" trigger on the webhook)
  onAssignment: true
  # -- Also start a review when the AI user is added as assignee
  onAssignee: true
  # -- Prompt used for assignment-triggered reviews (empty = built-in default)
  prompt: ""

rateLimiting:
  enabled: true
  # -- Max triggers per user/project/resource within the window
  max: 3
  # -- Window in seconds
  window: 900

# Bundled single-instance Redis for rate limiting.
# Ignored when rateLimiting.enabled is false.
redis:
  enabled: true
  # -- Redis URL to use when redis.enabled is false (e.g. a managed Redis)
  externalUrl: ""
  image:
    repository: redis
    tag: 7-alpine
    pullPolicy: IfNotPresent
  persistence:
    enabled: false
    size: 1Gi
    storageClass: ""
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi

logging:
  level: info     # debug | info | warn | error
  format: json    # json | pretty

# -- Extra environment variables for the middleware container
extraEnv: []
# - name: FOO
#   value: bar

# -- Extra envFrom sources (e.g. a ConfigMap with OPENCODE_AGENT_PROMPT)
extraEnvFrom: []

# -- Environment variables for the webhook pods **and** the gitlabSetup
# Job/CronJob, e.g. an outbound proxy; a map or a list of maps
# (`[{HTTPS_PROXY: "http://proxy:3128"}, {NO_PROXY: ".svc,gitlab.internal"}]`).
# With HTTP(S)_PROXY set, NODE_USE_ENV_PROXY=1 is added (Node's fetch ignores
# the proxy otherwise) and the Kubernetes API address is appended to NO_PROXY.
# NO_PROXY takes host names, domain suffixes (`.svc`) and IPs, but no CIDRs.
additionalEnvs: []

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

service:
  type: ClusterIP
  port: 80

# GitLab must be able to reach POST /webhook on this host.
ingress:
  enabled: false
  className: ""
  annotations: {}
  # cert-manager.io/cluster-issuer: letsencrypt
  hosts:
    - host: ai-agent.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  # - secretName: ai-agent-tls
  #   hosts: [ai-agent.example.com]

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 256Mi

nodeSelector: {}
tolerations: []
affinity: {}
