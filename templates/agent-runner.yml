# -- Runs the AI agent for every project from one central runner project
# (the chart's `agent.runnerProject`), so the target projects need no
# .gitlab-ci.yml changes. The webhook creates the pipelines through the API and
# passes the target as AI_PROJECT_ID / AI_PROJECT_PATH / AI_BRANCH; the agent
# clones it with GITLAB_AI_AGENT_TOKEN (or GITLAB_TOKEN). Include it only in the dedicated runner project:
# it sets `workflow:`, so it would disable every other pipeline there.
spec:
  inputs:
    stage:
      default: ai
      description: Pipeline stage the agent job runs in.
    job-name:
      default: ai_webhook_handler
      description: Name of the agent job.
    image:
      default: m13t/ai-agent-for-gitlab-agent
      description: >-
        Agent image repository, without the tag. Together with `version` the
        default for AI_AGENT_IMAGE; the chart's `agentImage`, passed by the
        webhook as a pipeline variable, wins over both.
    version:
      default: "0.10.0"
      description: >-
        Agent image tag, e.g. the release version (`0.5.0`). See `image`.
    tags:
      type: array
      default: []
      description: Runner tags, e.g. of a dedicated runner that injects the provider keys from a Kubernetes Secret.
    custom-agent-prompt:
      default: ""
      description: Instructions appended to the agent prompt (CUSTOM_AGENT_PROMPT), for every target project.
---

workflow:
  rules:
    # Only pipelines the webhook creates; pushes to the runner project don't run the agent.
    - if: '$CI_PIPELINE_SOURCE == "api" && $AI_TRIGGER == "true" && $AI_PROJECT_ID'
  # All agent pipelines share one branch, so GitLab's "auto-cancel redundant
  # pipelines" would cancel pending runs for other targets. The webhook cancels
  # only older runs for the same target (agent.cancelOldPipelines).
  auto_cancel:
    on_new_commit: none

stages:
  - $[[ inputs.stage ]]

variables:
  # -- Agent image; overridden by the webhook's AI_AGENT_IMAGE pipeline variable
  AI_AGENT_IMAGE: "$[[ inputs.image ]]:$[[ inputs.version ]]"

# -- Runs `ai-runner` against the target project given by the pipeline variables.
"$[[ inputs.job-name ]]":
  stage: $[[ inputs.stage ]]
  image: $AI_AGENT_IMAGE
  tags: $[[ inputs.tags ]]
  variables:
    # The agent clones the target project itself.
    GIT_STRATEGY: none
    CUSTOM_AGENT_PROMPT: $[[ inputs.custom-agent-prompt ]]
  script:
    - ai-runner
  # Result of the run ($CI_PROJECT_DIR/ai-output.json), also when it failed.
  artifacts:
    when: always
    paths:
      - ai-output.json
    expire_in: 1 week
