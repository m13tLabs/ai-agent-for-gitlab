name: CI

on:
  push:
    branches: [develop]
  pull_request:
  merge_group:
  # allow manual action run
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitlab-app:
    uses: m13tLabs/gh-actions-templates/.github/workflows/docker-ci.yml@main
    permissions:
      contents: read
      pull-requests: write
      checks: write
      packages: read
      attestations: write
    with:
      image_name: ai-agent-for-gitlab-app
      context: gitlab-app
      dockerhub: true
      # BATS suite against the freshly built image, see test/gitlab-app.bats.
      smoke_test: npx --yes bats@1.13.0 test/gitlab-app.bats
    secrets: inherit

  agent-image:
    uses: m13tLabs/gh-actions-templates/.github/workflows/docker-ci.yml@main
    permissions:
      contents: read
      pull-requests: write
      checks: write
      packages: read
      attestations: write
    with:
      image_name: ai-agent-for-gitlab-agent
      context: agent-image
      dockerhub: true
      # BATS suite against the freshly built image, see test/agent-image.bats.
      smoke_test: npx --yes bats@1.13.0 test/agent-image.bats
    secrets: inherit

  chart:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          check-latest: true

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.8.0
        with:
          version: v3.14.0
          yamale_version: '6.0.0'

      - name: Set up helm-docs
        uses: gabe565/setup-helm-docs-action@v1

      - name: Run chart-testing (lint)
        run: ct lint --config .ct.yaml --all

      - name: Check chart README is up to date
        run: |
          helm-docs --chart-search-root charts
          git diff --exit-code -- charts/ \
            || { echo "::error::Chart README is stale, run helm-docs and commit the result" >&2; exit 1; }

      # The release's bump_command; fails here instead of mid-release when a
      # values.yaml/Chart.yaml edit moves the entries it pins.
      - name: Test release version pinning
        run: npx --yes bats@1.13.0 test/pin-release-version.bats

  # Single required status check for branch protection: fails unless every
  # job above succeeded (a skipped or cancelled job counts as a failure too).
  build-result:
    name: Build Result
    if: always()
    runs-on: ubuntu-latest
    needs: [gitlab-app, agent-image, chart]
    steps:
      - name: Check job results
        # see https://stackoverflow.com/a/67532120/4907315
        if: >-
          ${{
            contains(needs.*.result, 'failure')
            || contains(needs.*.result, 'cancelled')
            || contains(needs.*.result, 'skipped')
          }}
        env:
          NEEDS: ${{ toJson(needs) }}
        run: |
          echo "One or more jobs did not succeed: $NEEDS" >&2
          exit 1
