name: Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Type of release to build: patch, minor, major, or custom'
        type: choice
        options: [patch, minor, major, custom]
        default: patch
        required: true
      custom_version:
        description: "Version to release (only used when release_type is 'custom', e.g. 1.2.3)"
        type: string
        required: false
        default: ''
      draft_release:
        description: 'Create the GitHub release as a draft'
        type: boolean
        required: false
        default: true
      chart_version:
        description: 'Helm chart version (X.Y.Z, higher than the current one). Empty = patch-bump the current chart version'
        type: string
        required: false
        default: ''

jobs:
  # bump_command is a shell string, so only a value checked here may go into
  # it; the input itself is never spliced into a script.
  chart-version:
    name: Check chart version
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - id: check
        env:
          CHART_VERSION: ${{ inputs.chart_version }}
        run: |
          if ! [[ "$CHART_VERSION" =~ ^([0-9]+\.[0-9]+\.[0-9]+)?$ ]]; then
            echo "::error::chart_version must be X.Y.Z or empty, got '$CHART_VERSION'"
            exit 1
          fi
          echo "version=$CHART_VERSION" >> "$GITHUB_OUTPUT"

  # One release, one version, two images: gitlab-app is the main build and
  # agent-image rides along as the template's "variant" build under its own
  # image names (no tag suffix).
  release:
    needs: chart-version
    uses: m13tLabs/gh-actions-templates/.github/workflows/docker-release.yml@main
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    with:
      images: '["ghcr.io/m13tlabs/ai-agent-for-gitlab-app","docker.io/m13t/ai-agent-for-gitlab-app"]'
      context: gitlab-app
      variant_images: '["ghcr.io/m13tlabs/ai-agent-for-gitlab-agent","docker.io/m13t/ai-agent-for-gitlab-agent"]'
      variant_context: agent-image
      variant_dockerfile: Dockerfile
      variant_suffix: ''
      client_id: ${{ vars.CI_CLIENT_ID }}
      release_type: ${{ inputs.release_type }}
      custom_version: ${{ inputs.custom_version }}
      default_branch: ${{ github.ref_name }}
      draft_release: ${{ inputs.draft_release }}
      dockerhub: true
      # Pin the chart's image.tag / agentImage.tag and Chart.yaml versions in
      # the release commit, like glab-docs pins its CI component template. The
      # chart version is X.Y.Z or empty (checked by the chart-version job);
      # empty patch-bumps it.
      bump_command: scripts/pin-release-version.sh "$RELEASE_VERSION" "${{ needs.chart-version.outputs.version }}"
    secrets: inherit

  # Publish the Helm chart pinned by the release commit (appVersion + image
  # tags == release version, chart version patch-bumped) as an OCI artifact,
  # like CloudTooling's chart releases.
  chart:
    name: Publish Helm chart
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.release.outputs.release_version }}
      CHART_VERSION: ${{ inputs.chart_version }}
    steps:
      # The release commit, not the v<version> tag: a draft release has no tag yet.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.release_sha }}

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          check-latest: true

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.9.0
        with:
          version: v3.14.0
          yamale_version: '6.0.0'

      - name: Run chart-testing (lint)
        run: ct lint --config .ct.yaml --all

      - name: Helm Package
        run: |
          helm package charts/ai-agent-for-gitlab
          # Guards that scripts/pin-release-version.sh ran in the release commit.
          helm show chart ./*.tgz | grep -qx "appVersion: \"\?${VERSION}\"\?"
          if [ -n "$CHART_VERSION" ]; then
            helm show chart ./*.tgz | grep -qx "version: ${CHART_VERSION}"
          fi

      - name: Login to GitHub Container Registry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push Charts to GHCR
        run: |
          shopt -s nullglob
          for pkg in *.tgz; do
            helm push "${pkg}" oci://ghcr.io/m13tlabs/helm-charts
          done
          rm -f ./*.tgz
