name: 🐞 Bug Report
description: File a new bug report
title: "[Bug]: <title>"
type: Bug
labels:
  - "bug"
  - "triage"
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!

        Per our [CONTRIBUTING guidelines](https://github.com/m13tLabs/ai-agent-for-gitlab/blob/main/.github/CONTRIBUTING.md), we use GitHub for bugs and feature requests, not general support.
  - type: checkboxes
    attributes:
      label: "Prerequisites"
      options:
        - label: "I've read, understood, and done my best to follow the [CONTRIBUTING guidelines](https://github.com/m13tLabs/ai-agent-for-gitlab/blob/main/.github/CONTRIBUTING.md)."
          required: true
        - label: "I have [searched the existing issues](https://github.com/m13tLabs/ai-agent-for-gitlab/issues) and this bug has not been reported yet."
          required: true
  - type: textarea
    attributes:
      label: "What did you do?"
      description: "Steps to reproduce the behavior."
    validations:
      required: true
  - type: textarea
    attributes:
      label: "What did you expect to happen?"
    validations:
      required: true
  - type: textarea
    attributes:
      label: "What happened instead?"
      description: |
        Describe the problem you are experiencing. Relevant log output is welcome.

        > :warning: _Remember to redact or remove any sensitive information (tokens, API keys, webhook secrets)!_
    validations:
      required: true
  - type: textarea
    attributes:
      label: "Environment"
      description: "Please provide the following information about your environment; feel free to remove any items which are not relevant."
      value: |
        - ai-agent-for-gitlab version / image tag:
        - Deployment (Helm chart, Docker, docker-compose, ...):
        - Node.js version:
        - Kubernetes version:
        - GitLab version / SaaS:
        - Agent (Claude Code, OpenCode, ...):
    validations:
      required: false
  - type: textarea
    attributes:
      label: "Demo Project"
      description: "Please link to or upload a project we can download that reproduces the issue."
    validations:
      required: false
