name: 🌟 Feature Request
description: Suggest an idea for this project
title: "[Feat]: <title>"
type: Feature
labels:
  - "enhancement"
  - "triage"
body:
  - type: markdown
    attributes:
      value: "Thank you for the interest in the project! :blush:"
  - type: checkboxes
    attributes:
      label: "Prerequisites"
      options:
        - label: "I've read, understood, and done my best to follow the [CONTRIBUTING guidelines](https://github.com/m13tLabs/ai-agent-for-gitlab/blob/main/.github/CONTRIBUTING.md)."
          required: true
  - type: textarea
    attributes:
      label: "Is your feature request related to a problem? Please describe."
      description: "A clear and concise description of what the problem is. Ex. I'm always frustrated when [...]"
    validations:
      required: true
  - type: textarea
    attributes:
      label: "Describe the solution you'd like"
      description: "A clear and concise description of what you want to happen."
    validations:
      required: true
  - type: textarea
    attributes:
      label: "Describe alternatives you've considered"
      description: "A clear and concise description of any alternative solutions or features you've considered."
    validations:
      required: false
  - type: textarea
    attributes:
      label: "Additional context"
      description: |
        Add any other context or screenshots about the feature request here.

        _Tip: You can attach images or log files by clicking this area to highlight it and then dragging files in._
    validations:
      required: false
